[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "poac"
version = "0.2.0"
description = "Proof of Agent Capability (PoAC): a reverse CAPTCHA that verifies capable AI agents and issues holder-bound receipts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "joserfc>=1.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# LLM-authored private corpus + LLM agent benchmark client
llm = ["pydantic-ai-slim>=1.0"]

[project.scripts]
poac-verifier = "poac.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
