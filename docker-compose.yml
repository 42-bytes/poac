# Hardened single-node deployment of the PoAC verifier.
#
#   cp deploy/env.example .env   # set POAC_PUBLIC_HOST, POAC_SERVER_SECRET
#   docker compose up -d --build
#
# Lean kernel checks run as subprocesses inside the verifier container; the
# flags below bound what an elaboration-time escape could reach: no
# capabilities, no privilege escalation, read-only root, a small tmpfs for
# the per-check scratch directory, and hard memory / pid ceilings (each Lean
# process is additionally capped via `lean --memory`, see
# POAC_LEAN_MAX_MEMORY_MB).
#
# Egress: the verifier sits on an internal (no-route) network and is
# reachable only through Caddy, which terminates TLS (automatic Let's
# Encrypt certificate for POAC_PUBLIC_HOST). Its single outbound path is
# the `kms-egress` sidecar, a forward proxy that admits only
# kms.<region>.amazonaws.com:443 so receipts can be signed in AWS KMS.
# The Lean subprocess runs with a scrubbed environment (no proxy vars, no
# AWS credentials).
#
# Persistent state lives in the `poac-data` volume: sessions + verify
# nonces (state.sqlite3), the private corpus (corpus.sqlite) and, only when
# not signing in KMS, the issuer key file named by POAC_ISSUER_KEY_ARGS.

services:
  verifier:
    build: .
    image: poac-verifier
    command: >
      poac-verifier
      --base-url https://${POAC_PUBLIC_HOST:?set POAC_PUBLIC_HOST in .env}
      --state-db /data/state.sqlite3
      ${POAC_ISSUER_KEY_ARGS:-}
    environment:
      POAC_SERVER_SECRET: ${POAC_SERVER_SECRET:?set POAC_SERVER_SECRET in .env}
      POAC_LEAN_MAX_MEMORY_MB: ${POAC_LEAN_MAX_MEMORY_MB:-1024}
      POAC_CORPUS_DB: ${POAC_CORPUS_DB:-}
      POAC_TRIALS_LOG: ${POAC_TRIALS_LOG:-/data/human-trials.jsonl}
      # issuer key in AWS KMS (deploy/aws-kms-setup.sh); empty = local key file
      POAC_KMS_ED25519_KEY: ${POAC_KMS_ED25519_KEY:-}
      POAC_KMS_MLDSA65_KEY: ${POAC_KMS_MLDSA65_KEY:-}
      POAC_KMS_REGION: ${POAC_KMS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # the only route out: the kms-egress sidecar (boto3 honours HTTPS_PROXY)
      HTTPS_PROXY: http://kms-egress:3128
    volumes:
      - poac-data:/data
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Allow-list egress for KMS only. Sits on both networks; admits
  # CONNECT kms.<region>.amazonaws.com:443 and denies everything else.
  kms-egress:
    image: ubuntu/squid:latest
    entrypoint: ["sh", "-c"]
    command:
      - >
        sed "s/__REGION__/$${POAC_KMS_REGION:-eu-north-1}/" /etc/squid/kms.conf.tpl > /tmp/squid.conf
        && exec squid -N -f /tmp/squid.conf
    environment:
      POAC_KMS_REGION: ${POAC_KMS_REGION:-eu-north-1}
    user: "proxy"
    volumes:
      - ./deploy/kms-egress.squid.conf.tpl:/etc/squid/kms.conf.tpl:ro
    tmpfs:
      - /tmp:size=32m
      - /var/log/squid:size=16m
      - /var/spool/squid:size=16m
    networks: [internal, default]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  proxy:
    image: caddy:2-alpine
    command: caddy reverse-proxy --from ${POAC_PUBLIC_HOST} --to verifier:8000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal, default]
    depends_on: [verifier]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  internal:
    internal: true

volumes:
  poac-data:
  caddy-data:
  caddy-config:
