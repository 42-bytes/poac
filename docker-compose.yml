# Hardened single-node deployment of the PoAC verifier.
#
#   cp deploy/env.example .env   # set POAC_PUBLIC_HOST, POAC_SERVER_SECRET
#   docker compose up -d --build
#
# Lean kernel checks run as subprocesses inside the verifier container; the
# flags below bound what an elaboration-time escape could reach: no
# capabilities, no privilege escalation, read-only root, a small tmpfs for
# the per-check scratch directory, and hard memory / pid ceilings (each Lean
# process is additionally capped via `lean --memory`, see
# POAC_LEAN_MAX_MEMORY_MB).
#
# Egress: the verifier needs no outbound network. It sits on an internal
# network and is reachable only through Caddy, which terminates TLS
# (automatic Let's Encrypt certificate for POAC_PUBLIC_HOST).
#
# Persistent state lives in the `poac-data` volume: sessions + verify
# nonces (state.sqlite3), the issuer key (issuer.jwk, created on first
# start) and, when present, the private corpus (corpus.sqlite).

services:
  verifier:
    build: .
    image: poac-verifier
    command: >
      poac-verifier
      --base-url https://${POAC_PUBLIC_HOST:?set POAC_PUBLIC_HOST in .env}
      --state-db /data/state.sqlite3
      --issuer-key-file /data/issuer.jwk
    environment:
      POAC_SERVER_SECRET: ${POAC_SERVER_SECRET:?set POAC_SERVER_SECRET in .env}
      POAC_LEAN_MAX_MEMORY_MB: ${POAC_LEAN_MAX_MEMORY_MB:-1024}
      POAC_CORPUS_DB: ${POAC_CORPUS_DB:-}
    volumes:
      - poac-data:/data
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  proxy:
    image: caddy:2-alpine
    command: caddy reverse-proxy --from ${POAC_PUBLIC_HOST} --to verifier:8000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal, default]
    depends_on: [verifier]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  internal:
    internal: true

volumes:
  poac-data:
  caddy-data:
  caddy-config:
