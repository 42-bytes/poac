# Build the verifier (with the pinned Lean toolchain) and the Caddy+route53
# proxy once, publish to GHCR. Nodes `docker compose pull` instead of
# compiling, so a 1 GB failover box never builds Lean.
name: image

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "deploy/caddy/**", "pyproject.toml", "src/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/42-bytes/poac-verifier:main
            ghcr.io/42-bytes/poac-verifier:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/caddy
          push: true
          tags: ghcr.io/42-bytes/poac-caddy:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
